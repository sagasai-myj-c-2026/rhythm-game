<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Game MVP</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="select-screen" hidden>
    <h1>Space Rhythm</h1>
    <p class="hint">ステージを選んでください</p>
    <div id="stage-list"></div>
  </div>

  <div id="game" hidden>
    <h1>Space Rhythm</h1>
    <p id="stageTitle"></p>
    <p class="hint">近づいてくる印がラインに重なった瞬間に Space キーを押そう</p>

    <div id="stage">
      <div id="noteLane">
        <div id="hitLine"></div>
      </div>
      <div id="character"></div>
      <div id="judgment"></div>
      <div id="mouthIndicator" hidden>😶</div>

      <div id="overlay" hidden>
        <div id="overlayContent">
          <h2 id="overlayTitle">終了！</h2>
          <p id="overlayScore"></p>
          <button id="overlayRetryBtn">もう一度プレイ</button>
        </div>
      </div>
    </div>

    <div id="hud">
      <div class="hudItem">
        <span class="hudLabel">SCORE</span>
        <span id="score" class="hudValue">0</span>
      </div>
      <div class="hudItem">
        <span class="hudLabel">COMBO</span>
        <span id="combo" class="hudValue">0</span>
      </div>
    </div>

    <div id="controls">
      <button id="startBtn">スタート</button>
      <button id="pauseBtn" hidden>一時停止</button>
      <button id="restartBtn" hidden>最初から</button>
    </div>

    <label id="volumeControl">
      音量
      <input type="range" id="volume" min="0" max="100" value="80">
    </label>

    <p id="mouthStatus" hidden></p>

    <a id="backLink" href="./">ステージ選択へ戻る</a>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
